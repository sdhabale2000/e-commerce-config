spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=*

# Customer Service
spring.cloud.gateway.mvc.routes[0].id=customer-service
spring.cloud.gateway.mvc.routes[0].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/customers/**

# Product Service
spring.cloud.gateway.mvc.routes[1].id=product-service
spring.cloud.gateway.mvc.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/products/**

# Order Service
spring.cloud.gateway.mvc.routes[2].id=order-service
spring.cloud.gateway.mvc.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/orders/**
